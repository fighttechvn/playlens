<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayLens – Cài đặt</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1f1f1f;
      --muted: #5f6368;
      --card: #f8f9fa;
      --border: rgba(0, 0, 0, 0.12);
      --accent: #0b57d0;
      --accent-fg: #fff;
      --track: #c4c7c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1f;
        --fg: #e3e3e3;
        --muted: #9aa0a6;
        --card: #2a2a2a;
        --border: rgba(255, 255, 255, 0.15);
        --accent: #a8c7fa;
        --accent-fg: #062e6f;
        --track: #5f6368;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Google Sans Text', Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    .sub {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
    }
    h2 {
      margin: 24px 0 8px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      cursor: pointer;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row .text { flex: 1; min-width: 0; }
    .row .name { font-weight: 500; }
    .row .desc {
      margin-top: 1px;
      font-size: 12.5px;
      color: var(--muted);
    }
    /* toggle switch */
    .switch { position: relative; flex: none; width: 44px; height: 24px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--track);
      transition: background 0.15s;
      pointer-events: none;
    }
    .slider::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: var(--card); }
    .status {
      font-size: 12.5px;
      color: var(--muted);
    }
    .foot {
      margin-top: 28px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PlayLens</h1>
    <p class="sub">Cài đặt hiển thị — áp dụng ngay trên các tab Google Play đang mở, không cần reload.</p>

    <h2>Chế độ hiển thị</h2>
    <div class="card" id="flags">
      <label class="row">
        <span class="text">
          <span class="name">Badge overlay trên icon</span>
          <div class="desc">Dải thông tin ⬇ downloads · ★ review · ⟳ ngày update đè lên đáy icon từng app, không chiếm chỗ trong layout. <em>Tự ẩn khi bật "Thông tin dưới rating" để không hiện trùng.</em></div>
        </span>
        <span class="switch"><input type="checkbox" id="overlay" /><span class="slider"></span></span>
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Thông tin dưới rating trong card</span>
          <div class="desc">Dòng nhỏ <code>⬇100M+ · 824.1K rv</code> + ngày update (tô màu theo độ tươi) chèn ngay dưới dòng rating có sẵn của card.</div>
        </span>
        <span class="switch"><input type="checkbox" id="inline" /><span class="slider"></span></span>
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Panel danh sách bên phải</span>
          <div class="desc">Bảng tổng hợp mọi app đã quét (sort theo cột, click hàng mở app, copy CSV). Mở/đóng bằng nút 📊 ở mép phải.</div>
        </span>
        <span class="switch"><input type="checkbox" id="panel" /><span class="slider"></span></span>
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Mở panel sẵn khi vào trang</span>
          <div class="desc">Panel tự bung ra mỗi khi vào trang Play (trạng thái cũng được nhớ khi bạn tự mở/đóng).</div>
        </span>
        <span class="switch"><input type="checkbox" id="panelOpen" /><span class="slider"></span></span>
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Lưu app đã xem (Recent)</span>
          <div class="desc">Mỗi lần bạn mở trang chi tiết một app, app đó được ghi vào tab <b>Recent</b> của panel (tối đa 60 app, lưu ngay trên máy bạn, không gửi đi đâu).</div>
        </span>
        <span class="switch"><input type="checkbox" id="recent" /><span class="slider"></span></span>
      </label>
    </div>

    <h2>Dữ liệu</h2>
    <div class="actions">
      <button id="clearCache">Xóa cache dữ liệu app</button>
      <button id="clearRecent">Xóa danh sách Recent</button>
      <span class="status" id="status"></span>
    </div>
    <p class="foot">
      Dữ liệu app (downloads / review / ngày update) được cache 12 giờ trong trình duyệt.
      Mã nguồn: <a href="https://github.com/fighttechvn/playlens" target="_blank" rel="noopener">github.com/fighttechvn/playlens</a>
    </p>
  </div>
  <script src="options.js"></script>
</body>
</html>
